[project]
name = "translator-ai-ocr"
version = "1.2.0"
description = "AI screen & Live Captions translator - OCR and offline neural translation with a caption bar overlay"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
authors = [
    { name = "triplepai14" }
]
keywords = ["ocr", "translation", "japanese", "live-captions", "subtitles"]

dependencies = [
    # OCR (Japanese)
    "meikiocr",
    "onnxruntime",
    # OCR (Latin text)
    "rapidocr-onnxruntime",
    # Translation (CTranslate2 models: Sugoi V4, NLLB-200)
    "ctranslate2",
    "sentencepiece",
    "huggingface_hub",
    # Image processing
    "Pillow>=10.0.0",
    "numpy",
    "opencv-python",
    # Screen capture
    "mss>=9.0.0",
    # Configuration
    "PyYAML>=6.0",
    # Online translation engines
    "requests",
    # Logging
    "structlog>=24.0.0",
    # GUI
    "PySide6>=6.6.0",
    # Windows: window capture + Live Captions UI Automation
    "pygetwindow>=0.0.9; sys_platform == 'win32'",
    "windows-capture-interpreter>=1.5.1; sys_platform == 'win32'",
    "uiautomation>=2.0.18; sys_platform == 'win32'",
    # GPU acceleration (CUDA 12)
    "nvidia-cublas-cu12; sys_platform == 'win32' or sys_platform == 'linux'",
    "nvidia-cudnn-cu12; sys_platform == 'win32' or sys_platform == 'linux'",
]

[project.scripts]
translator-ai-ocr = "translator_ai_ocr:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/translator_ai_ocr"]

[dependency-groups]
dev = [
    "ruff>=0.14.10",
    "pytest>=8.0.0",
    "pyinstaller>=6.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src"]
